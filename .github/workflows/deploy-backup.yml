name: Deploy scripts to EC2

# Espelha server/scripts/** pra /opt/kyvvo/scripts/ na EC2 (backup-db.sh,
# gen-env-from-ssm.sh, ...) e (re)instala o cron do backup.

on:
  push:
    branches: [release]
    paths:
      - "server/scripts/**"
  workflow_dispatch:

jobs:
  deploy-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"

      - name: Copiar scripts pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/scripts/*"
          target: "/opt/kyvvo/scripts"
          strip_components: 2

      - name: Permissão + cron do backup
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            chmod +x /opt/kyvvo/scripts/*.sh
            mkdir -p /opt/kyvvo/backups
            ( crontab -l 2>/dev/null | grep -v 'backup-db.sh' ; echo "15 3 * * * /opt/kyvvo/scripts/backup-db.sh >> /opt/kyvvo/backups/backup.log 2>&1" ) | crontab -
