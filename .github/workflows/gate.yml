name: Gate

# labeled/unlabeled entram para que aplicar (ou tirar) o selo 'revisado:infra'
# re-rode o gate sem precisar de um commit vazio.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Roda pra todo mundo, Dependabot incluído: o NPM_PACKAGES_TOKEN está nos
    # Dependabot secrets (Settings > Secrets > Dependabot), então o npm install
    # autentica no GitHub Packages também nas PRs de bump.

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyvvo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kyvvo_test
      NODE_ENV: test
      # Ver comentário em agente.yml: o .npmrc versionado expande
      # ${NPM_PACKAGES_TOKEN}; sem ele no env o npm.pkg.github.com dá E401.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      # Dois projetos npm independentes — não há root package.json, `npm ci`
      # na raiz dava EUSAGE.
      - name: Instalar dependências (landing)
        run: npm ci
        working-directory: server
      - name: Instalar dependências (painel)
        run: npm ci
        working-directory: server/panel

      # Mesmo script que o deploy.yml usa em produção (deploy-panel ->
      # scripts/aplicar-migrations.js, via `docker compose run`) — um script
      # só pra "como aplicar migrations", testado aqui do zero a cada PR
      # antes de chegar em produção. Fixtures de dev (006/017) ficam de fora
      # (a lista está no próprio script, não duplicada aqui).
      - name: Aplicar migrations do zero, em ordem
        env:
          MIGRATIONS_DIR: server/db
        run: node server/panel/scripts/aplicar-migrations.js

      - name: Testes unitários
        run: node --test server/panel/tests-unit/

      # Playwright ainda chama Asaas/Meta/Resend/Anthropic de verdade — até
      # ter stub/desligamento por NODE_ENV=test, roda mas não reprova o
      # gate (gate parcial verde > gate completo vermelho e ignorado).
      # Remover o continue-on-error quando os serviços estiverem stubbados.
      - name: Testes de integração (Playwright)
        continue-on-error: true
        timeout-minutes: 8   # se travar batendo em serviço externo, corta aqui e não come o budget do job
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: server/panel

  # Barra PR que toca infra/CI/migrations/serviços externos sem selo humano.
  # Dependabot fica de fora (bumps de versão de action são revisados no merge).
  caminhos-protegidos:
    runs-on: ubuntu-latest
    # Este fica: bump do Dependabot mexe em .github/workflows/ e package.json
    # (caminhos protegidos) e ele não tem como aplicar a label 'revisado:infra'
    # — sem o if, toda PR de bump reprovaria aqui.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Exigir label 'revisado:infra' para mexer em caminho protegido
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          case " $LABELS " in
            *" revisado:infra "*)
              echo "PR carrega o selo 'revisado:infra' — liberado."
              exit 0 ;;
          esac
          # Workflows/dependabot/CODEOWNERS sim; ISSUE_TEMPLATE e afins não.
          PROTEGIDOS='^(\.github/workflows/|\.github/dependabot\.yml|\.github/CODEOWNERS|CLAUDE\.md|server/db/|server/scripts/|server/\.npmrc|server/panel/\.npmrc|server/package\.json|server/panel/package\.json|server/panel/(asaas|meta-whatsapp|anthropic|evolution)-service\.js)'
          MUDOU=$(git diff --name-only "$BASE" "$HEAD" | grep -E "$PROTEGIDOS" || true)
          if [ -n "$MUDOU" ]; then
            echo "::error::PR toca caminho protegido sem a label 'revisado:infra'."
            echo "Arquivos:"
            echo "$MUDOU" | sed 's/^/  - /'
            echo
            echo "Se a mudança é intencional e foi revisada por um humano,"
            echo "aplique a label 'revisado:infra' na PR e rode o gate de novo."
            exit 1
          fi
          echo "Nenhum caminho protegido tocado."
