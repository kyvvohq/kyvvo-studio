<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aceitar convite — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card card-cadastro">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>

    <div id="estado-carregando">
      <p class="cadastro-sub">Carregando convite...</p>
    </div>

    <div id="estado-invalido" hidden>
      <h1 class="cadastro-titulo">Convite indisponível</h1>
      <p class="cadastro-sub" id="mensagem-invalido"></p>
      <p class="cadastro-rodape"><a href="/login">Ir para o login</a></p>
    </div>

    <div id="estado-form" hidden>
      <h1 class="cadastro-titulo">Você foi convidado!</h1>
      <p class="cadastro-sub" id="convite-descricao"></p>

      <form id="form-aceitar-convite" novalidate>
        <label for="email">E-mail</label>
        <input type="email" id="email" disabled>
        <label for="nome">Seu nome</label>
        <input type="text" id="nome" autocomplete="name">
        <div class="field-error" id="erro-nome"></div>
        <label for="senha">Crie uma senha</label>
        <div class="senha-wrapper">
          <input type="password" id="senha" autocomplete="new-password">
          <button type="button" id="btn-toggle-senha" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">👁</button>
        </div>
        <div class="field-error" id="erro-senha"></div>
        <button type="submit" id="btn-aceitar">Aceitar convite e entrar</button>
        <div class="erro" id="erro-geral" role="alert"></div>
      </form>
    </div>
  </div>
</div>
<footer data-ds-rodape data-ds-produto="Studio"></footer>
<script>
  const ROLE_LABEL = { administrador: 'administrador', operador: 'operador' };
  const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const SENHA_REGEX = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

  const token = new URLSearchParams(window.location.search).get('token');
  const estadoCarregando = document.getElementById('estado-carregando');
  const estadoInvalido = document.getElementById('estado-invalido');
  const estadoForm = document.getElementById('estado-form');

  function mostrarInvalido(mensagem) {
    estadoCarregando.hidden = true;
    estadoInvalido.hidden = false;
    document.getElementById('mensagem-invalido').textContent = mensagem;
  }

  async function carregarConvite() {
    if (!token) {
      mostrarInvalido('Link de convite inválido. Peça um novo convite ao administrador da sua equipe.');
      return;
    }

    let res;
    try {
      res = await fetch(`/api/equipe/convites/${encodeURIComponent(token)}`);
    } catch (e) {
      mostrarInvalido('Erro de conexão. Tente novamente.');
      return;
    }

    if (!res.ok) {
      mostrarInvalido('Convite não encontrado. Peça um novo convite ao administrador da sua equipe.');
      return;
    }
    const convite = await res.json();

    const mensagensStatus = {
      aceito: 'Este convite já foi aceito. Se já tem conta, faça login normalmente.',
      expirado: 'Este convite expirou. Peça um novo convite ao administrador da sua equipe.',
      cancelado: 'Este convite foi cancelado pelo administrador da sua equipe.',
    };
    if (convite.status !== 'pendente') {
      mostrarInvalido(mensagensStatus[convite.status] || 'Este convite não está mais disponível.');
      return;
    }

    estadoCarregando.hidden = true;
    estadoForm.hidden = false;
    document.getElementById('email').value = convite.email;
    document.getElementById('convite-descricao').textContent =
      `${convite.tenant_nome} te convidou para fazer parte da equipe, como ${ROLE_LABEL[convite.role] || convite.role}. Crie uma senha para acessar o Kyvvo.`;
  }
  carregarConvite();

  const senhaInput = document.getElementById('senha');
  document.getElementById('btn-toggle-senha').addEventListener('click', () => {
    const oculta = senhaInput.type === 'password';
    senhaInput.type = oculta ? 'text' : 'password';
  });

  const form = document.getElementById('form-aceitar-convite');
  const nomeInput = document.getElementById('nome');
  const campos = { nome: nomeInput, senha: senhaInput };
  const validadores = {
    nome: (v) => (v.trim().length >= 2 ? '' : 'Informe seu nome.'),
    senha: (v) => (SENHA_REGEX.test(v || '') ? '' : 'Mínimo 8 caracteres, 1 número e 1 letra maiúscula.'),
  };

  function mostrarErroCampo(nomeCampo, mensagem) {
    const input = campos[nomeCampo];
    document.getElementById('erro-' + nomeCampo).textContent = mensagem;
    input.classList.toggle('invalid', !!mensagem);
    return !mensagem;
  }

  Object.keys(campos).forEach((nomeCampo) => {
    campos[nomeCampo].addEventListener('blur', () => mostrarErroCampo(nomeCampo, validadores[nomeCampo](campos[nomeCampo].value)));
    campos[nomeCampo].addEventListener('input', () => {
      if (campos[nomeCampo].classList.contains('invalid')) {
        mostrarErroCampo(nomeCampo, validadores[nomeCampo](campos[nomeCampo].value));
      }
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const erroEl = document.getElementById('erro-geral');
    erroEl.textContent = '';

    let valido = true;
    let primeiroInvalido = null;
    Object.keys(campos).forEach((nomeCampo) => {
      const ok = mostrarErroCampo(nomeCampo, validadores[nomeCampo](campos[nomeCampo].value));
      if (!ok) {
        valido = false;
        if (!primeiroInvalido) primeiroInvalido = campos[nomeCampo];
      }
    });
    if (!valido) {
      primeiroInvalido.focus();
      return;
    }

    const btn = document.getElementById('btn-aceitar');
    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch(`/api/equipe/convites/${encodeURIComponent(token)}/aceitar`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: nomeInput.value.trim(), senha: senhaInput.value }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        localStorage.setItem('kyvvo_token', data.token);
        localStorage.setItem('kyvvo_nome', data.nome || '');
        localStorage.setItem('kyvvo_email', data.email || '');
        localStorage.setItem('kyvvo_email_verified', 'true');
        window.location.href = '/painel';
        return;
      }

      erroEl.textContent = data.error || 'Não foi possível aceitar o convite. Tente novamente.';
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Aceitar convite e entrar';
    }
  });
</script>
<script src="/ds/components.js"></script>
</body>
</html>
