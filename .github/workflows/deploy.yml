name: Deploy to EC2

on:
  push:
    branches: [release]
    paths:
      - 'server/index.js'
      - 'server/package.json'
      - 'server/.npmrc'
      - 'server/public-studio/**'
      - 'server/panel/**'
      # Faltava — um push só com migration (server/db/**, sem tocar em
      # server/panel/**) não disparava o workflow nem aqui no topo nem no
      # filtro `panel:` abaixo (achado 2026-10-12: migration 091 mergeada
      # em main, push pra release, nenhum run disparou — só não quebrou
      # nada porque o PATCH /api/configuracoes/crm/sistema continuava
      # dependendo da migration mesmo, então o erro ficou visível).
      - 'server/db/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            landing:
              - 'server/index.js'
              - 'server/package.json'
              - 'server/.npmrc'
              - 'server/public-studio/**'
            panel:
              - 'server/panel/**'
              # deploy-panel é quem copia server/db/** e roda
              # aplicar-migrations.js — migration sem mudança em
              # server/panel/** precisa disparar esse job do mesmo jeito.
              - 'server/db/**'

  deploy-landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Copiar arquivos da landing page pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/index.js,server/package.json,server/.npmrc,server/public-studio/**"
          target: "/opt/kyvvo/landing"
          strip_components: 1
      # Health check (2026-09-25): sem isso, "o deploy rodou" só confirmava
      # que o container foi recriado, nunca que o npm install/app dentro
      # dele realmente subiu. Sem rota de health dedicada — `/` (index.html
      # via @fastify/static) já confirma o Fastify de pé.
      - name: Reiniciar container da landing + checar saúde
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            set -e
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate landing
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3000/ > /dev/null; then
                echo "OK: / respondeu na tentativa ${i} (~$((i * 2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "::error::/ não respondeu depois de ~30s — logs do container:"
            sudo docker logs kyvvo-landing-1 --tail 80
            exit 1

  deploy-panel:
    needs: changes
    if: needs.changes.outputs.panel == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Gravar versão do deploy (US54)
        run: |
          COMMIT_CURTO="${GITHUB_SHA::7}"
          echo "{\"commit\":\"${COMMIT_CURTO}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > server/panel/version.json
          sed -i "s/__COMMIT_SHA__/${COMMIT_CURTO}/" server/panel/public/admin/version.js
      - name: Copiar arquivos do painel pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/panel/**"
          target: "/opt/kyvvo/panel"
          strip_components: 2
      # server/db/** nunca tinha saído do repo — migration de schema sempre
      # dependeu de alguém rodar psql à mão na EC2 depois do deploy (achado
      # 2026-09-10: 068/069/070 ficaram pra trás em produção por horas, a
      # tela de Automações inteira devolvia 500). Copiado à parte (path
      # diferente de server/panel/**) pra não misturar migration com código
      # do painel; scripts/aplicar-migrations.js (que roda a seguir) espera
      # achar os .sql em ../db a partir de si mesmo.
      - name: Copiar migrations pra EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/db/**"
          target: "/opt/kyvvo/panel/db"
          strip_components: 2
      # Health check (2026-09-25): sem isso, "o deploy rodou" só confirmava
      # que o container foi recriado, nunca que o npm install/app dentro
      # dele realmente subiu (nem que as migrations aplicaram sem erro —
      # embora essa parte já falhasse o job por causa do `set -e`). Sem rota
      # de health dedicada — `/` (index.html via @fastify/static) já
      # confirma o Fastify de pé.
      - name: Reiniciar container do painel + checar saúde
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            set -e
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo
            # Migrations ANTES de recriar o container — com `set -e`, se
            # essa rodada falhar o `up -d --force-recreate` seguinte não
            # roda: nunca sobe código novo contra um schema que ele não
            # espera. `run --rm` usa a mesma imagem/env_file/bind-mount do
            # serviço studio (/opt/kyvvo/panel:/app), sem depender do
            # container antigo estar de pé.
            sudo docker compose run --rm studio node scripts/aplicar-migrations.js
            sudo docker compose up -d --force-recreate studio
            for i in $(seq 1 15); do
              if curl -sf http://127.0.0.1:3001/ > /dev/null; then
                echo "OK: / respondeu na tentativa ${i} (~$((i * 2))s)."
                exit 0
              fi
              sleep 2
            done
            echo "::error::/ não respondeu depois de ~30s — logs do container:"
            sudo docker logs kyvvo-studio-1 --tail 80
            exit 1
