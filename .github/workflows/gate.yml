name: Gate

on: [pull_request]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kyvvo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/kyvvo_test
      NODE_ENV: test
      # Ver comentário em agente.yml: o .npmrc versionado expande
      # ${NPM_PACKAGES_TOKEN}; sem ele no env o npm.pkg.github.com dá E401.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      # Dois projetos npm independentes — não há root package.json, `npm ci`
      # na raiz dava EUSAGE.
      - name: Instalar dependências (landing)
        run: npm ci
        working-directory: server
      - name: Instalar dependências (painel)
        run: npm ci
        working-directory: server/panel

      - name: Aplicar migrations do zero, em ordem
        run: |
          for f in $(ls server/db/*.sql | sort); do
            echo "→ $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Testes unitários
        run: node --test server/panel/tests-unit/

      # Playwright ainda chama Asaas/Meta/Resend/Anthropic de verdade — até
      # ter stub/desligamento por NODE_ENV=test, roda mas não reprova o
      # gate (gate parcial verde > gate completo vermelho e ignorado).
      # Remover o continue-on-error quando os serviços estiverem stubbados.
      - name: Testes de integração (Playwright)
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
        working-directory: server/panel
