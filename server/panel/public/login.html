<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/style.css">
<style>
  /* Página carregada dentro do iframe do modal de login da landing
     (server/public/partials/header.html) — sem rodapé e sem scroll, pra
     caber inteira na altura fixa do modal (login-modal, shared.css). */
  html, body { height: 100%; overflow: hidden; }
</style>
<script src="/analytics.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card">
    <div class="ds-topbar-marca ds-login-marca">
      <span class="ds-topbar-produto"><span class="ds-topbar-produto-acento">St</span>udio</span>
      <span class="ds-topbar-kyvvo">kyvvo</span>
    </div>
    <form id="form-login" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
      <div class="field-error" id="erro-email"></div>
      <label for="senha">Senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" autocomplete="current-password">
        <button type="button" id="btn-toggle-senha" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">👁</button>
      </div>
      <div class="field-error" id="erro-senha"></div>
      <button type="submit" id="btn-entrar">Entrar</button>
      <div class="erro" id="erro" role="alert"></div>
      <div class="sucesso" id="sucesso" role="status" hidden></div>
    </form>
    <p class="cadastro-rodape"><a href="/esqueci-senha">Esqueci minha senha</a></p>
  </div>
</div>
<script>
  const form = document.getElementById('form-login');
  const erroEl = document.getElementById('erro');
  const sucessoEl = document.getElementById('sucesso');
  const btn = document.getElementById('btn-entrar');
  const emailInput = document.getElementById('email');
  const senhaInput = document.getElementById('senha');
  const toggleSenhaBtn = document.getElementById('btn-toggle-senha');
  const inIframe = window.self !== window.top;

  // US54 — avisa que a senha foi redefinida com sucesso (redirect de
  // /redefinir-senha.html).
  if (new URLSearchParams(window.location.search).get('senha_redefinida') === '1') {
    sucessoEl.hidden = false;
    sucessoEl.textContent = 'Senha redefinida com sucesso. Faça login com a nova senha.';
  }

  // Mesma regex usada em cadastro.html — validação visual básica de formato,
  // não substitui a checagem real de credenciais feita pelo backend.
  const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const campos = { email: emailInput, senha: senhaInput };
  const validadores = {
    email: (v) => (v.trim() && EMAIL_REGEX.test(v.trim()) ? '' : 'Digite um e-mail válido.'),
    senha: (v) => (v ? '' : 'Digite sua senha.'),
  };

  function mostrarErroCampo(nome, mensagem) {
    const input = campos[nome];
    const alvo = document.getElementById('erro-' + nome);
    alvo.textContent = mensagem;
    input.classList.toggle('invalid', !!mensagem);
    return !mensagem;
  }

  // CA03 — validação visual ao perder o foco, refeita a cada novo caractere
  // enquanto o campo já estiver marcado como inválido.
  Object.keys(campos).forEach((nome) => {
    campos[nome].addEventListener('blur', () => mostrarErroCampo(nome, validadores[nome](campos[nome].value)));
    campos[nome].addEventListener('input', () => {
      if (campos[nome].classList.contains('invalid')) {
        mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      }
    });
  });

  function irParaPainel() {
    if (inIframe) {
      // Carregado dentro do modal de login da landing: avisa o pai em vez de
      // navegar só dentro do iframe, para a aba inteira ir para o painel.
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success' }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/painel';
    }
  }

  function irParaAdminPainel() {
    if (inIframe) {
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success', admin: true }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/admin/painel.html';
    }
  }

  // Login sem e-mail validado (US20/CA10): manda pra tela de validação do
  // token em vez de entrar no portal.
  function irParaVerificar() {
    if (inIframe) {
      try {
        window.parent.postMessage({ source: 'kyvvo-login', status: 'success', verificar: true }, '*');
      } catch (e) {}
    } else {
      window.location.href = '/verificar';
    }
  }

  if (localStorage.getItem('kyvvo_token')) {
    // CA10: mesma checagem do handler de submit — não deixar cair direto no
    // painel se o cadastro ainda não foi validado.
    if (localStorage.getItem('kyvvo_email_verified') === 'false') {
      irParaVerificar();
    } else {
      irParaPainel();
    }
  } else if (localStorage.getItem('kyvvo_admin_token')) {
    irParaAdminPainel();
  }

  toggleSenhaBtn.addEventListener('click', () => {
    const oculta = senhaInput.type === 'password';
    senhaInput.type = oculta ? 'text' : 'password';
    toggleSenhaBtn.textContent = oculta ? '🙈' : '👁';
    toggleSenhaBtn.setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.textContent = '';

    let valido = true;
    let primeiroInvalido = null;
    Object.keys(campos).forEach((nome) => {
      const ok = mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      if (!ok) {
        valido = false;
        if (!primeiroInvalido) primeiroInvalido = campos[nome];
      }
    });
    if (!valido) {
      primeiroInvalido.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Entrando...';

    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value,
          senha: senhaInput.value,
          produto: 'studio',
        }),
      });

      if (res.ok) {
        const data = await res.json();
        localStorage.setItem('kyvvo_token', data.token);
        localStorage.setItem('kyvvo_nome', data.nome || '');
        if (data.email) localStorage.setItem('kyvvo_email', data.email);
        localStorage.setItem('kyvvo_email_verified', String(data.email_verified !== false));
        if (data.email_verified === false) {
          irParaVerificar();
        } else {
          irParaPainel();
        }
        return;
      }

      // 403 = credenciais corretas mas tenant desativado (CA02 da US16): erro
      // real e específico, não faz sentido cair no fallback de admin nem
      // mostrar a mensagem genérica de "senha incorretos" por cima dele.
      if (res.status === 403) {
        const dataTenant = await res.json().catch(() => ({}));
        erroEl.textContent = dataTenant.error || 'Acesso desativado. Fale com o suporte da Kyvvo.';
        return;
      }

      // Não bateu como tenant — antes de mostrar erro, tenta como admin da
      // Kyvvo, já que o mesmo formulário atende os dois públicos agora.
      const resAdmin = await fetch('/admin/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value,
          senha: senhaInput.value,
        }),
      });

      if (resAdmin.ok) {
        const dataAdmin = await resAdmin.json();
        localStorage.setItem('kyvvo_admin_token', dataAdmin.token);
        localStorage.setItem('kyvvo_admin_nome', dataAdmin.nome || '');
        irParaAdminPainel();
        return;
      }

      erroEl.textContent = 'E-mail ou senha incorretos. Tente novamente.';
      senhaInput.value = '';
      senhaInput.focus();
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
