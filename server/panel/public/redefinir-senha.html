<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div class="center-screen">
  <div class="card">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <h1 class="cadastro-titulo">Redefinir senha</h1>
    <p class="cadastro-sub">Digite o código de 6 dígitos enviado por e-mail e escolha uma nova senha.</p>

    <form id="form-redefinir" novalidate>
      <label for="email">E-mail</label>
      <input type="email" id="email" autocomplete="email">
      <div class="field-error" id="erro-email"></div>

      <label for="token">Código de verificação</label>
      <input type="text" id="token" inputmode="numeric" autocomplete="one-time-code" maxlength="6" class="otp-input" placeholder="000000">
      <div class="field-error" id="erro-token"></div>

      <label for="senha">Nova senha</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" autocomplete="new-password">
        <button type="button" id="btn-toggle-senha" class="toggle-senha" aria-label="Mostrar senha" tabindex="-1">👁</button>
      </div>
      <div class="field-error" id="erro-senha"></div>

      <button type="submit" id="btn-redefinir">Redefinir senha</button>
      <div class="erro" id="erro" role="alert"></div>
    </form>

    <p class="cadastro-rodape">Não recebeu o código? <a href="/esqueci-senha">Solicitar novo</a></p>
  </div>
</div>
<footer data-ds-rodape data-ds-produto="Studio"></footer>
<script>
  const form = document.getElementById('form-redefinir');
  const emailInput = document.getElementById('email');
  const tokenInput = document.getElementById('token');
  const senhaInput = document.getElementById('senha');
  const toggleSenhaBtn = document.getElementById('btn-toggle-senha');
  const btn = document.getElementById('btn-redefinir');
  const erroEl = document.getElementById('erro');

  const EMAIL_REGEX = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const SENHA_REGEX = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

  // E-mail pré-preenchido pra quem veio de /esqueci-senha.html — ainda
  // editável, caso o usuário tenha digitado o e-mail errado por lá.
  const emailQuery = new URLSearchParams(window.location.search).get('email');
  if (emailQuery) emailInput.value = emailQuery;

  tokenInput.addEventListener('input', () => {
    tokenInput.value = tokenInput.value.replace(/\D/g, '').slice(0, 6);
  });

  toggleSenhaBtn.addEventListener('click', () => {
    const oculta = senhaInput.type === 'password';
    senhaInput.type = oculta ? 'text' : 'password';
    toggleSenhaBtn.textContent = oculta ? '🙈' : '👁';
    toggleSenhaBtn.setAttribute('aria-label', oculta ? 'Ocultar senha' : 'Mostrar senha');
  });

  const campos = { email: emailInput, token: tokenInput, senha: senhaInput };
  const validadores = {
    email: (v) => (v.trim() && EMAIL_REGEX.test(v.trim()) ? '' : 'Digite um e-mail válido.'),
    token: (v) => (/^\d{6}$/.test(v) ? '' : 'Digite o código de 6 dígitos.'),
    senha: (v) => (SENHA_REGEX.test(v || '') ? '' : 'Mínimo 8 caracteres, 1 número e 1 letra maiúscula.'),
  };

  function mostrarErroCampo(nome, mensagem) {
    const input = campos[nome];
    const alvo = document.getElementById('erro-' + nome);
    alvo.textContent = mensagem;
    input.classList.toggle('invalid', !!mensagem);
    return !mensagem;
  }

  Object.keys(campos).forEach((nome) => {
    campos[nome].addEventListener('blur', () => mostrarErroCampo(nome, validadores[nome](campos[nome].value)));
    campos[nome].addEventListener('input', () => {
      if (campos[nome].classList.contains('invalid')) {
        mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      }
    });
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    erroEl.textContent = '';

    let valido = true;
    let primeiroInvalido = null;
    Object.keys(campos).forEach((nome) => {
      const ok = mostrarErroCampo(nome, validadores[nome](campos[nome].value));
      if (!ok) {
        valido = false;
        if (!primeiroInvalido) primeiroInvalido = campos[nome];
      }
    });
    if (!valido) {
      primeiroInvalido.focus();
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Redefinindo...';

    try {
      const res = await fetch('/api/auth/redefinir-senha', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          token: tokenInput.value,
          senha: senhaInput.value,
        }),
      });
      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        window.location.href = '/login?senha_redefinida=1';
        return;
      }

      erroEl.textContent = data.error || 'Não foi possível redefinir a senha. Tente novamente.';
    } catch (err) {
      erroEl.textContent = 'Erro de conexão. Tente novamente.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Redefinir senha';
    }
  });
</script>
<script src="/ds/components.js"></script>
</body>
</html>
