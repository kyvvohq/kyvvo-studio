name: Agente

on:
  issues:
    types: [labeled]

concurrency:
  group: agente-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dev:
    if: >
      github.event.label.name == 'agent:tests' ||
      github.event.label.name == 'agent:admin' ||
      github.event.label.name == 'agent:panel' ||
      github.event.label.name == 'agent:landing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"

      # setup-node grava um .npmrc no runner que usa NODE_AUTH_TOKEN, mas o
      # .npmrc versionado tem precedência e expande ${NPM_PACKAGES_TOKEN} —
      # precisa dos dois no env, senão o token some e o npm.pkg.github.com
      # devolve E401.
      - name: Instalar dependências (landing)
        run: npm ci
        working-directory: server
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      - name: Instalar dependências (painel)
        run: npm ci
        working-directory: server/panel
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
          NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}
            LABEL: ${{ github.event.label.name }}

            Implemente este issue seguindo integralmente o CLAUDE.md da raiz,
            incluindo a lista de caminhos protegidos e o fluxo obrigatório.

            A label indica a categoria permitida. `agent:tests` significa que
            você só pode alterar arquivos em server/panel/tests/ e
            server/panel/tests-unit/ — nada além disso.

            OBRIGATÓRIO no fim: faça commit, push da sua branch e **abra a PR
            você mesmo** com
            `gh pr create --base main --head <sua-branch> --title "<título>" --body "<resumo>\n\nCloses #${{ github.event.issue.number }}"`.
            A tarefa não está concluída sem a PR aberta.
          claude_args: |
            --max-turns 60
            --allowedTools Read,Glob,Grep,Edit,Write,Bash,Bash(gh pr create:*)
