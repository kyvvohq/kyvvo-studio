name: Regenerar package-lock

# Uso único (workflow_dispatch): roda `npm install` em server/panel/ com o
# NPM_PACKAGES_TOKEN do repo e abre uma PR com o package-lock.json atualizado —
# server/panel/package.json ganhou @kyvvohq/whatsapp e o lock precisa ser
# gerado com um token que tenha read:packages. Apagar este arquivo depois que
# a PR do lock entrar e o gate voltar pra `npm ci`.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  regen:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
      NPM_PACKAGES_TOKEN: ${{ secrets.NPM_PACKAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@kyvvohq"
      - name: npm install (painel)
        run: npm install --no-audit --no-fund
        working-directory: server/panel
      - name: Abrir PR se o lock mudou
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- server/panel/package-lock.json; then
            echo "Lock já em dia — nada a fazer."; exit 0
          fi
          BRANCH="ci/regen-package-lock-panel"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add server/panel/package-lock.json
          git commit -m "CI: regenera server/panel/package-lock.json (@kyvvohq/whatsapp)"
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --label "revisado:infra" \
            --title "CI: regenera server/panel/package-lock.json (@kyvvohq/whatsapp)" \
            --body "Gerado pelo regen-locks.yml. Depois de mergear: trocar \`npm install --no-package-lock\` de volta por \`npm ci\` no gate e no agente, e apagar o regen-locks.yml." \
          || echo "Abra a PR manualmente: https://github.com/${{ github.repository }}/compare/main...$BRANCH"
