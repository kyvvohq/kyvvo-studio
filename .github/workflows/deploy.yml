name: Deploy to EC2

on:
  push:
    branches: [release]
    paths:
      - 'server/index.js'
      - 'server/package.json'
      - 'server/.npmrc'
      - 'server/public-studio/**'
      - 'server/panel/**'
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      landing: ${{ steps.filter.outputs.landing }}
      panel: ${{ steps.filter.outputs.panel }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            landing:
              - 'server/index.js'
              - 'server/package.json'
              - 'server/.npmrc'
              - 'server/public-studio/**'
            panel:
              - 'server/panel/**'

  deploy-landing:
    needs: changes
    if: needs.changes.outputs.landing == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Copiar arquivos da landing page pra EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/index.js,server/package.json,server/.npmrc,server/public-studio/**"
          target: "/opt/kyvvo/landing"
          strip_components: 1
      - name: Reiniciar container da landing
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate landing

  deploy-panel:
    needs: changes
    if: needs.changes.outputs.panel == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar chave SSH
        id: sshkey
        run: |
          KEY="$(printf '%s' '${{ secrets.EC2_SSH_KEY_B64 }}' | base64 -d)"
          while IFS= read -r line; do [ -n "$line" ] && echo "::add-mask::$line"; done <<< "$KEY"
          {
            echo 'value<<KEYEOF'
            printf '%s\n' "$KEY"
            echo 'KEYEOF'
          } >> "$GITHUB_OUTPUT"
      - name: Gravar versão do deploy (US54)
        run: |
          COMMIT_CURTO="${GITHUB_SHA::7}"
          echo "{\"commit\":\"${COMMIT_CURTO}\",\"deployedAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > server/panel/version.json
          sed -i "s/__COMMIT_SHA__/${COMMIT_CURTO}/" server/panel/public/admin/version.js
      - name: Copiar arquivos do painel pra EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          source: "server/panel/**"
          target: "/opt/kyvvo/panel"
          strip_components: 2
      - name: Reiniciar container do painel
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ steps.sshkey.outputs.value }}
          script: |
            sudo /opt/kyvvo/scripts/gen-env-from-ssm.sh
            cd /opt/kyvvo && sudo docker compose up -d --force-recreate studio
