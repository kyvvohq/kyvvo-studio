<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  // Só faz sentido regularizar quem já tem sessão (mesmo padrão de
  // verificar.html) — sem token não tem o que cadastrar aqui.
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login';
  }
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regularize sua conta — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="center-screen">
  <div class="card card-bloqueio">
    <div class="logo">ky<span class="logo-vv">vv</span>o</div>
    <h1 class="cadastro-titulo" id="bloqueio-titulo">Seu período gratuito terminou</h1>
    <p class="cadastro-sub" id="bloqueio-sub">Cadastre um meio de pagamento para continuar usando o Kyvvo. Seus dados continuam salvos e disponíveis assim que a assinatura for ativada.</p>

    <div id="bloqueio-plano"></div>

    <div class="bloqueio-explicacao" id="bloqueio-explicacao"></div>

    <div id="bloqueio-form"></div>

    <p class="bloqueio-suporte" id="bloqueio-suporte"></p>

    <p class="cadastro-rodape">
      <a href="#" id="link-sair">Sair da conta</a>
    </p>
  </div>
</div>
<footer data-ds-rodape data-ds-produto="Studio"></footer>
<script src="/pagamento-form.js"></script>
<script>
  const token = localStorage.getItem('kyvvo_token');

  async function api(path, options = {}) {
    const res = await fetch(path, {
      ...options,
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${token}`,
        ...(options.headers || {}),
      },
    });
    if (res.status === 401) {
      localStorage.removeItem('kyvvo_token');
      window.location.href = '/login';
      return null;
    }
    return res.json();
  }

  // Toast mínimo, mesmo comportamento visual do painel (app.js) — sem
  // importar o script inteiro, que assume elementos do painel completo
  // (menu, abas de agenda) que não existem nesta tela standalone.
  function mostrarToast(mensagem, tipo = 'sucesso') {
    let container = document.getElementById('toast-container');
    if (!container) {
      container = document.createElement('div');
      container.id = 'toast-container';
      container.className = 'toast-container';
      document.body.appendChild(container);
    }
    const toast = document.createElement('div');
    toast.className = `toast toast-${tipo}`;
    toast.textContent = (tipo === 'sucesso' ? '✅ ' : '❌ ') + mensagem;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('toast-saindo');
      setTimeout(() => toast.remove(), 250);
    }, 4000);
  }

  document.getElementById('link-sair').addEventListener('click', async (e) => {
    e.preventDefault();
    try {
      await fetch('/api/auth/logout', { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
    } catch (err) {
      // Sem conexão: prossegue com o logout local mesmo assim.
    }
    localStorage.removeItem('kyvvo_token');
    localStorage.removeItem('kyvvo_nome');
    localStorage.removeItem('kyvvo_email');
    window.location.href = 'https://studio.kyvvo.com.br';
  });

  // US52 — dispara em "melhor esforço": perder essa métrica não pode
  // travar a tela de regularização pro tenant.
  function registrarEventoAnalytics(tipo) {
    api('/api/eventos', { method: 'POST', body: JSON.stringify({ tipo }) });
  }

  // Uma cópia por motivo de bloqueio (calcularBloqueioAssinatura no
  // backend) — trial e cancelado ainda não têm plano contratado (mostram
  // "a ser contratado"); inadimplente/suspenso já são pagantes, só
  // precisam regularizar a forma de pagamento (mostram "atual").
  const BLOQUEIO_COPY = {
    trial_expirado: {
      titulo: 'Seu período gratuito terminou',
      sub: 'Cadastre um meio de pagamento para continuar usando o Kyvvo. Seus dados continuam salvos e disponíveis assim que a assinatura for ativada.',
      labelPlano: 'Plano a ser contratado',
      explicacao: '<p>Enquanto isso, agenda, clientes, serviços e configurações ficam indisponíveis — seus dados continuam preservados e você recupera o acesso completo assim que o pagamento for confirmado.</p><p>A cobrança começa a partir da confirmação do cadastro abaixo.</p>',
    },
    inadimplente: {
      titulo: 'Não conseguimos confirmar seu pagamento',
      sub: 'Atualize sua forma de pagamento para regularizar sua assinatura. Seus dados continuam salvos e disponíveis assim que o pagamento for confirmado.',
      labelPlano: 'Plano atual',
      explicacao: '<p>Enquanto isso, agenda, clientes, serviços e configurações ficam indisponíveis — seus dados continuam preservados e você recupera o acesso completo assim que o pagamento for confirmado.</p>',
    },
    suspenso: {
      titulo: 'Sua assinatura foi suspensa',
      sub: 'Não conseguimos processar seu pagamento. Atualize sua forma de pagamento para reativar o acesso.',
      labelPlano: 'Plano atual',
      explicacao: '<p>Enquanto isso, agenda, clientes, serviços e configurações ficam indisponíveis — seus dados continuam preservados e você recupera o acesso completo assim que o pagamento for confirmado.</p>',
    },
    cancelado: {
      titulo: 'Sua assinatura foi encerrada',
      sub: 'O período pago da sua assinatura já terminou. Cadastre um meio de pagamento para reativar sua conta.',
      labelPlano: 'Plano a ser contratado',
      explicacao: '<p>Enquanto isso, agenda, clientes, serviços e configurações ficam indisponíveis — seus dados continuam preservados e você recupera o acesso completo assim que a assinatura for reativada.</p>',
    },
  };

  async function montarTelaBloqueio() {
    const dados = await api('/api/pagamentos');
    if (!dados) return;

    // CA — quem não está realmente bloqueado (trial ainda ativo, já
    // pagante, ou dentro da carência de inadimplência) não tem o que fazer
    // aqui; manda de volta pro painel em vez de mostrar uma tela de
    // cobrança fora de contexto. Mesma fonte de verdade de `authenticate`
    // (calcularBloqueioAssinatura), calculada no backend.
    const copy = BLOQUEIO_COPY[dados.bloqueio_motivo];
    if (!copy) {
      window.location.href = '/painel';
      return;
    }

    registrarEventoAnalytics('bloqueio_exibido');

    document.getElementById('bloqueio-titulo').textContent = copy.titulo;
    document.getElementById('bloqueio-sub').textContent = copy.sub;

    document.getElementById('bloqueio-plano').innerHTML = `
      <div class="financeiro-resumo-card" style="margin-bottom:16px">
        <div class="financeiro-resumo-label">${copy.labelPlano}</div>
        <div>${dados.plano_nome || 'Profissional'}${dados.valor_plano != null ? ` — ${formatarPreco(dados.valor_plano)}/mês` : ''}</div>
      </div>
    `;

    document.getElementById('bloqueio-explicacao').innerHTML = copy.explicacao;

    const suporteEmail = dados.suporte_email || 'suporte@kyvvo.com.br';
    const suporteWhatsapp = dados.suporte_whatsapp;
    document.getElementById('bloqueio-suporte').textContent = suporteWhatsapp
      ? `Dúvidas? Fale com o suporte pelo e-mail ${suporteEmail} ou WhatsApp ${suporteWhatsapp}.`
      : `Dúvidas? Fale com o suporte pelo e-mail ${suporteEmail}.`;

    document.getElementById('bloqueio-form').innerHTML = htmlFormPagamento(dados, { comBotaoCancelar: false });
    // wireFormPagamento já mostra o toast de sucesso — só falta redirecionar
    // de volta pro painel, com um respiro pro tenant ler o toast antes da
    // navegação trocar a tela.
    wireFormPagamento(dados, {
      onSucesso: () => {
        setTimeout(() => { window.location.href = '/painel'; }, 1500);
      },
    });
  }
  montarTelaBloqueio();
</script>
<script src="/ds/components.js"></script>
</body>
</html>
