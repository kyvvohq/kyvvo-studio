<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  if (!localStorage.getItem('kyvvo_token')) {
    window.location.href = '/login';
  }
  // Tema aplicado antes do primeiro paint (evita flash). Chave `kyvvo_tema`,
  // valores 'light'/'dark' — o mesmo dialeto data-theme do @kyvvohq/design-system.
  document.documentElement.setAttribute('data-theme', localStorage.getItem('kyvvo_tema') || 'light');
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel — Kyvvo</title>
<link rel="icon" type="image/svg+xml" href="/ds/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/ds/tokens.css">
<link rel="stylesheet" href="/ds/components.css">
<link rel="stylesheet" href="/style.css">
<script src="/analytics.js"></script>
</head>
<body>
<div id="trial-banner" class="trial-banner" hidden></div>
<div id="avisos-painel"></div>
<div class="topbar">
  <div class="topbar-esquerda">
    <button class="topbar-logo" id="topbar-logo" aria-label="Ir para o início">
      <img class="js-logo-kyvvo topbar-logo-img" src="/ds/logo.svg" alt="Kyvvo">
    </button>
    <span class="topbar-produto-tag">Studio</span>
  </div>
  <div class="user-menu" id="user-menu">
    <button class="user-menu-toggle" id="user-menu-toggle">
      <div class="user-menu-avatar" id="user-menu-avatar"></div>
      <div class="user-menu-textos">
        <div class="user-menu-nome" id="user-menu-nome"></div>
        <div class="user-menu-empresa" id="user-menu-empresa"></div>
      </div>
      <span class="user-menu-chevron">▾</span>
    </button>
    <div class="user-menu-dropdown" id="user-menu-dropdown" hidden>
      <div class="user-menu-item" data-menu="perfil">Meu Perfil</div>
      <div class="user-menu-item" data-menu="equipe" data-somente-admin data-somente-plano-custom>Equipe</div>
      <div class="user-menu-item" data-menu="ajuda">Ajuda</div>
      <button class="user-menu-tema" id="btn-tema-toggle" type="button" role="switch" aria-checked="false">
        <span>Tema</span>
        <span class="user-menu-tema-estado" id="user-menu-tema-estado">Claro</span>
      </button>
      <div class="user-menu-divisor"></div>
      <button class="user-menu-sair" id="btn-sair"><span aria-hidden="true">⎋</span> Sair</button>
    </div>
  </div>
</div>
<div id="cobranca-banner" class="cobranca-banner" hidden>
  <span class="cobranca-banner-texto" id="cobranca-banner-texto"></span>
  <button type="button" class="cobranca-banner-fechar" id="cobranca-banner-fechar" aria-label="Fechar aviso">×</button>
</div>
<div class="painel-shell">
  <nav class="ds-menu" data-ds-menu id="painel-sidebar">
    <div class="ds-menu-topo">
      <span class="ds-menu-marca"><img class="js-logo-kyvvo" src="/ds/logo.svg" alt="Kyvvo"></span>
      <button type="button" class="ds-menu-toggle" id="btn-toggle-sidebar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
    </div>
    <ul class="ds-menu-lista">
      <li><button type="button" class="ds-menu-link menu-item" data-menu="inicio" data-icon="layout-dashboard"><span class="ds-menu-icone"></span><span class="ds-menu-rotulo">Início</span></button></li>
      <li><button type="button" class="ds-menu-link menu-item" data-menu="quadro" data-icon="kanban"><span class="ds-menu-icone"></span><span class="ds-menu-rotulo">Quadro</span></button></li>
      <li><button type="button" class="ds-menu-link menu-item" data-menu="agendamento" data-icon="calendar-days"><span class="ds-menu-icone"></span><span class="ds-menu-rotulo">Agenda</span></button></li>
      <li><button type="button" class="ds-menu-link menu-item" data-menu="clientes" data-icon="users"><span class="ds-menu-icone"></span><span class="ds-menu-rotulo">Clientes</span></button></li>
      <li id="menu-modulos-anchor" hidden></li>
      <li class="ds-menu-grupo">
        <button type="button" class="ds-menu-link ds-menu-grupo-botao" id="menu-config-toggle" data-submenu="menu-config-submenu" data-icon="settings" aria-expanded="false">
          <span class="ds-menu-icone"></span>
          <span class="ds-menu-rotulo">Configurações</span>
          <span class="ds-menu-seta"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></span>
        </button>
        <ul class="ds-menu-sub" id="menu-config-submenu">
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="cadastro">Cadastro</button></li>
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="empresa" data-somente-admin>Meu negócio</button></li>
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="configuracao" data-somente-admin>Preferências</button></li>
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="whatsapp">WhatsApp</button></li>
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="automacoes" data-somente-admin>Automações</button></li>
          <li><button type="button" class="ds-menu-sublink menu-item" data-menu="pagamentos" data-somente-admin>Plano e cobrança</button></li>
        </ul>
      </li>
    </ul>
  </nav>
  <div class="painel-main">
    <div class="subtabs" id="subtabs" style="display: none;">
      <div class="agenda-visoes">
        <button type="button" class="agenda-visao agenda-visao-ativa" data-tab="dia">Dia</button>
        <button type="button" class="agenda-visao" data-tab="semana">Semana</button>
        <button type="button" class="agenda-visao" data-tab="mes">Mês</button>
      </div>
      <button class="btn-novo-agendamento" id="btn-novo-agendamento">+ Novo agendamento</button>
    </div>
    <div class="subtabs" id="subtabs-cadastro" style="display: none;">
      <div class="tab active" data-aba-cadastro="servicos">Serviços</div>
      <div class="tab" data-aba-cadastro="profissionais">Profissionais</div>
      <div class="tab" data-aba-cadastro="bloqueios">Bloqueio de agenda</div>
    </div>
    <div class="conteudo" id="conteudo"></div>
  </div>
</div>
<footer data-ds-rodape></footer>

<script src="/pagamento-form.js"></script>
<script src="/app.js"></script>
<script src="/ds/components.js"></script>
</body>
</html>
