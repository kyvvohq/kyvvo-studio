name: Agente

on:
  issues:
    types: [labeled]

concurrency:
  group: agente-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  dev:
    if: >
      github.event.label.name == 'agent:tests' ||
      github.event.label.name == 'agent:admin' ||
      github.event.label.name == 'agent:panel' ||
      github.event.label.name == 'agent:landing'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
